[HistoryReport]
    #
    # Settings for the HTML month/year color coded summary table generator
    #
    log = 0

    # This list determines which tables will appear in the history report, as well as in which order.
    ## history_items = min_temp, avg_temp, max_temp, rain, rain_days, max_wind, NOAA
    history_items = min_temp, avg_temp, max_temp, rain, rain_days, max_wind, max_UV, max_radiation, min_barometer, avg_barometer, max_barometer, outTemp30_days, outTemp35_days, outTemp40_days, outTemp_days, outTemp20_days, outTemp20x_days, outTemp200_days, vegetations_days, outTemp0_days, outTemp00_days, sunshineDur, rainDur, growdeg, heatdeg, cooldeg, NOAA

    # Restrict the size of the table by ignoring everything before startdate
    # Specify in unix epoch time. e.g. 1325376000 is 1-Jan-2012
    # Note: whatever you specify as startdate, the whole year (or better: all
    # the values availlable for this year) this startdate is within, will be included in the table.
    #startdate = 1325376000

    # Depending on computing power it can take some time to calculate all the summaries with a few years of weather date.
    # refresh_interval is how often in minutes the tables are calculated.
    refresh_interval = 5

    [[min_temp]]
        obs_type = outTemp                 # obs_type can be any weewx reading
        aggregate_type = min               # Any of these: 'sum', 'count', 'avg', 'max', 'min'
        #for the next items, default is false
        summary_column = true              #show the summary column
        summary_heading = Min
        alltime_min = true                 #show the alltime minimum for each month and year, only fully covered months and years are considered, if the aggregation_type is 'min', also partially covered months and years are considered
        alltime_avg = true                 #show the alltime average for each month and year, only fully covered months and years are considered
        alltime_max = true                 #show the alltime maximum for each month and year, only fully covered months and years are considered, if the aggregation_type is 'max', also partially covered months and years are considered

    #
    # You can also use these aggregate_types:  'max_ge', 'max_le', 'min_le', 'sum_ge' to count days
    # where an observation is ge: greater of equalto, or le: lessthan or equal to a threshold value
    # To specify this threshold, use: aggregate_threshold = [value], [units]
    #
    # e.g Specify temperature threshold of 20C:  aggregate_threshold = 20, degree_C
    #

    [[avg_temp]]
        obs_type = outTemp
        aggregate_type = avg
        summary_column = true
        summary_heading = &nbsp;&nbsp;&nbsp;&oslash;&nbsp;&nbsp;
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[max_temp]]
        obs_type = outTemp
        aggregate_type = max
        summary_column = true
        summary_heading = Max
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[rain]]
        obs_type = rain
        aggregate_type = sum
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[rain_days]]
        obs_type = rain
        colors = rainDays, count # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = Tage                        # Override default table units label
        aggregate_type = sum_ge
        aggregate_threshold = 0.1, mm
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[max_wind]]
        obs_type = windGust
        aggregate_type = max
        summary_column = true
        summary_heading = Max
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[max_UV]]
        obs_type = UV
        colors = UV, uv_index
        startdate = 1675209600
        units = index
        aggregate_type = max
        summary_heading = Max
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[max_radiation]]
        obs_type = radiation
        colors = radiation, watt_per_meter_squared
        startdate = 1675209600
        aggregate_type = max
        summary_column = true
        summary_heading = Max
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[min_barometer]]
        obs_type = barometer
        colors = barometer, hPa
        aggregate_type = min
        summary_column = true
        summary_heading = Min
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[avg_barometer]]
        obs_type = barometer
        colors = barometer, hPa
        aggregate_type = avg
        summary_column = true
        summary_heading = &oslash;
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[max_barometer]]
        obs_type = barometer
        colors = barometer, hPa
        aggregate_type = max
        summary_column = true
        summary_heading = Max
        alltime_min = true
        alltime_avg = true
        alltime_max = true

    [[outTemp40_days]]
        obs_type = outTemp
        colors = outTemp_days, count	  #degree_C
        units = Tage                        # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 40, degree_C
        summary_column = true
        summary_heading = "Max≥40"

    [[outTemp35_days]]
        obs_type = outTemp
        colors = outTemp_days, count	  #degree_C
        units = Tage                        # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 35, degree_C
        summary_column = true
        summary_heading = "Max≥35"

    [[outTemp30_days]]
        obs_type = outTemp
        colors = outTemp_days, count	  #degree_C
        units = Tage                        # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 30, degree_C
        summary_column = true
        summary_heading = "Max≥30"

    [[outTemp_days]]
        obs_type = outTemp
        colors = outTemp_days, count	  #degree_C
        units = Tage                        # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 25, degree_C
        summary_column = true
        summary_heading = "Max≥25"

    [[outTemp20_days]]
        obs_type = outTemp
        colors = outTemp_days, count
        units = Tage                        # Override default table units label
        aggregate_type = max_ge
        aggregate_threshold = 20, degree_C
        summary_column = true
        summary_heading = "Max≥20"

    [[outTemp20x_days]]
        obs_type = outTemp
        colors = outTemp_days, count
        units = Tage                        # Override default table units label
        aggregate_type = min_ge
        aggregate_threshold = 17, degree_C
        summary_column = true
        summary_heading = "Min≥17"

    [[outTemp200_days]]
        obs_type = outTemp
        colors = outTemp_days, count
        units = Tage                        # Override default table units label
        aggregate_type = min_ge
        aggregate_threshold = 20, degree_C
        summary_column = true
        summary_heading = "Min≥20"

    [[vegetations_days]]
        obs_type = outTemp
        colors = outTempavg_days, count
        units = Tage                        # Override default table units label
        aggregate_type = avg_ge
        aggregate_threshold = 5, degree_C
        summary_column = true
        summary_heading =  "ø≥5"

    [[outTemp0_days]]
        obs_type = outTemp
        colors = outTemp0_days, count
        units = Tage
        aggregate_type = min_le
        aggregate_threshold = 0, degree_C
        summary_column = true
        summary_heading = "Min≤0"

    [[outTemp00_days]]
        obs_type = outTemp
        colors = outTemp0_days, count
        units = Tage
        aggregate_type = max_le
        aggregate_threshold = 0, degree_C
        summary_column = true
        summary_heading = "Max≤0"

   [[sunshineDur]]
       obs_type = sunshineDur
       colors = sunshineDur, hour
       aggregate_type = sum
       units = h
       #startdate = 1677628800
       startdate = 1675209600
       summary_column = true
