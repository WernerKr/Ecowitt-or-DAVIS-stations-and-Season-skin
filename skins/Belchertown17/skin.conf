[HistoryReport]

   refresh_interval = 5
    
   [[min_temp]]
        obs_type = outTemp    # obs_type can be any weewx reading
        aggregate_type = min    # Any of these: 'sum', 'count', 'avg', 'max', 'min'
        summary_column = true
        alltime_min = true
        alltime_avg = true
        alltime_max = true
        summary_heading = Min
        
        #
        # You can also use these aggregate_types:  'max_ge', 'max_le', 'min_le', 'sum_ge' to count days
        # where an observation is ge: greater of equalto, or le: lessthan or equal to a threshold value
        # To specify this threshold, use: aggregate_threshold = [value], [units]
        #
        # e.g Specify temperature threshold of 20C:  aggregate_threshold = 20, degree_C
        #

        [[avg_temp]]
        obs_type = outTemp
        aggregate_type = avg
        summary_column = true
        summary_heading = Avg

        [[max_temp]]
        obs_type = outTemp
        aggregate_type = max
        summary_column = true
        summary_heading = Max

        [[rain]]
        obs_type = rain
        aggregate_type = sum
        summary_column = true
        summary_heading = Jahr
        
        [[rain_days]]
        obs_type = rain
        colors = rainDays, count    # colors are derived from obs_type per default, specify colors from [Colors] to override
        units = Tage    # Override default table units label
        aggregate_type = sum_ge
        aggregate_threshold = 0.99, mm
        summary_column = true
        summary_heading = Jahr

        [[max_wind]]
        obs_type = windGust
        aggregate_type = max
        summary_column = true
        summary_heading = Max

        [[max_UV]]
        obs_type = UV
        aggregate_type = max
        summary_column = true
        units = UV-I
        colors = UV, UV-I
        summary_heading = Max
        
        [[max_rad]]
        obs_type = radiation
        aggregate_type = max
        summary_column = true
        summary_heading = Max

