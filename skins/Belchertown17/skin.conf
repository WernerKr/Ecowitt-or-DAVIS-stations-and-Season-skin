[Extras]

    # General Site Defaults
    belchertown_debug = 0
    belchertown_locale = "auto"
    belchertown_root_url = http://192.168.xx.xx/weewx/belchertown
    theme = auto
    site_title = "Wetter "
    show_apptemp = 1
    show_windrun = 1

    theme_toggle_enabled = 1
    logo_image = ""
    logo_image_dark = ""
    radar_html = ""
    radar_html_dark = ""
    radar_width = 650
    radar_height = 360
    radar_marker = 0
    radar_zoom = 9

    # radar_overlay for Windy:
    #radar = default
    #wind, gustgust, Accu, satellite, pressure, temp, dewpoint, rh, wetbulbtemp, solarpower, uvindex, rain, rainAccu, snowAccu,
    #snowcover, ptype, thunder, clouds, hclouds, mclouds, lclouds, fog, cloudtop, cbase, visibility, cape, ccl,
    #wavePower,  aod550, gtco3 (=Ozon), tcso2, cosc, dustsm, 
    #no2, pm2p5, go3

    radar_overlay = wind

    # Forecast unit of measures
    radar_rain     = "default" # default, mm, in
    radar_temp     = "default" # default, C,  F
    radar_wind     = "km/h" # default, kt, m/s, km/h, mph, bft
    aeris_map      = 0
    almanac_extras = 1

    # Station Observations. Special observation rainWithRainRate combines Daily Rain with Rain Rate in 1 line
    station_observations = outHumidity, rainWithRainRate, radiation, UV, barometer, GTSdate, GTS, dayET, ET24, rxCheckPercent

    # Manifest Settings for Mobile Phones
      #manifest_name = pc-wetterstation.de
      #manifest_short_name = Lackenhäuser
    manifest_name = "My Weather Website"
    manifest_short_name = "MWW"

    # Highcharts settings
    highcharts_enabled = 1
    graph_page_show_all_button = 1
    graph_page_default_graphgroup = "homepage"
    highcharts_homepage_graphgroup = "homepage"
    highcharts_decimal = "auto"
    highcharts_thousands = "auto"

    # MQTT Websockets defaults
    mqtt_websockets_enabled         = 0
    mqtt_websockets_host            = "xxxxx_deleted.bestsrv.de"
    mqtt_websockets_port            = 1883		# 9001
    mqtt_websockets_ssl             = 0
    mqtt_websockets_topic           = "weather/loop"
    mqtt_websockets_username        = ""
    mqtt_websockets_password        = ""
    disconnect_live_website_visitor = 1800000

    # Show an alert if the page updated timestamp is older than expected with this setting. Does not apply to MQTT Websocket enabled websites
    # The late time threshold is defined in seconds. This should be greater than your archive_interval from weewx.conf.
    # Typically you would want this 2 or 3 times archive_interval
    show_last_updated_alert = 1
    last_updated_alert_threshold = 1800

    # If mqtt_websockets_enabled is set to 0, but want the page to full reload on an interval, specify this below in milliseconds. 300000 = 5 minutes
    webpage_autorefresh = 300000

    # Image Reload Section.
    # Set reload_hook_images to 1 to enable, then set the number of *seconds* for each section to reload.
    # A value of -1 will disable reloading images in that section.
    # radar = the radar image if you used radar_html setting
    # asi = index_hook_after_station_info.inc
    # af = index_hook_after_forecast.inc
    # as = index_hook_after_snapshot.inc
    # ac = index_hook_after_charts.inc
    reload_hook_images = 1
    reload_images_radar = 300
    reload_images_hook_asi = -1
    reload_images_hook_af = -1
    reload_images_hook_as = -1
    reload_images_hook_ac = 300

    # Forecast defaults
    forecast_enabled = 1
    # forecast_provider = "pirateweather", "aeris", "xweather"
    # forecast_api_id = ryFMIph2Uk6CEDhjPK97e1beylS0WVBI
    forecast_provider = "pirateweather"
    forecast_api_id = xxxxx_deleted
    forecast_api_secret = xxxxx_deleted		# not used with pirateweather
    forecast_units = ca
    forecast_interval_hours = 1
    
    forecast_lang = de
    forecast_stale = 3540 			# 59 minutes
    current_conditions_stale = 3540 	# 59 minutes    
    forecast_aeris_use_metar          = 1
    forecast_alert_enabled            = 1
    forecast_alert_limit              = 1
    forecast_show_daily_forecast_link = 0
    forecast_daily_forecast_link = ""
    forecast_show_humidity_dewpoint   = 1
    # For forecast API calls, override the [station].longitude and
    # [station].latitude with this value. Ideal when a different "place"
    # provides a more accurate forecast.
    #
    # For acceptable places, see
    # https:   //www.xweather.com/docs/weather-api/reference/places
    #
    # To test values, use the Xweather API Wizard: 
    #
    # https:   //developer.xweather.com/product/api/category
    #
    # Note: ensure there are no spaces. For example "new+york,ny",
    # "37.25,-97.25", etc.
    forecast_place = ""
    #forecast_place = "48.78,13.8"
    # Xweather endpoint to use to obtain Current Conditions: obs, cond, if-no-obs-do-cond
    #
    # obs               = based on a variety of reporting stations (best)
    # conds             = the conditions are interpolated (better than nothing)
    # obs-on-fail-conds = Try the Observsation endpoint and if it fails, try
    #                       the Conditions endpoint.
    #
    #                       Failures result in an extra API call.
    current_conditions = "obs-on-fail-conds"

    # Whether to display a timestamp when the observations (current conditions) were last made - see Daily Forecast row
    current_conditions_timestamp_enabled = 1

    # Air Quality Index (AQI) defaults
    aqi_enabled = 1
    aqi_location_enabled = 1

    # Show Beaufort wind scale category under wind table
    beaufort_category = 1
    beaufort_category_gusts = 1

    # Earthquake defaults
    earthquake_enabled = 1
    earthquake_maxradiuskm = 1000
    earthquake_stale = 10740
    earthquake_server = USGS
    geonet_mmi = 4

    # Social Share Button Defaults. Define the text below under Labels
    facebook_enabled = 0
    twitter_enabled = 0
    social_share_html = "http://yourwebsite"

    # Google Analytics
    #googleAnalyticsId = UA-12345678-1

    # This is the display of the Pi Kiosk which is in the /pi folder
    pi_kiosk_bold = "false"
    pi_theme      = "auto"

    # This is the display of the kiosk page which is kiosk.html
    radar_html_kiosk              = ""
    radar_width_kiosk             = 490
    radar_height_kiosk            = 362
    mqtt_websockets_host_kiosk    = ""
    mqtt_websockets_port_kiosk    = ""
    mqtt_websockets_ssl_kiosk     = ""
    forecast_interval_hours_kiosk = 24
    aqi_enabled_kiosk             = 1

    # Display a Back To Top Button
    back_to_top_button_enabled = 1
    # Button position, 0 for right side , 1 for left side
    back_to_top_button_position = 0
    # Button opacity from 0.1 to 1.0
    back_to_top_button_opacity = 0.8


